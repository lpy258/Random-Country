<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机国家抽取器</title>
    <style>
        :root {
            --primary-color: #3498db;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        #display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-color);
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #ddd;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            background: #fafafa;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🌍 随机国家抽取</h1>
    <div id="display">准备好了吗？</div>
    <button id="drawBtn">开始抽取</button>
</div>

<script>
    const countries = [
        "英国", "法国", "意大利", "西班牙", "希腊", "土耳其", "约旦", "伊朗", 
        "俄罗斯", "中国", "日本", "印度", "柬埔寨", "印度尼西亚", "澳大利亚", 
        "马里", "埃及", "苏丹", "埃塞俄比亚", "坦桑尼亚", "津巴布韦", "南非", 
        "加拿大", "美国", "墨西哥", "哥伦比亚", "秘鲁", "玻利维亚", "智利", "巴西"
    ];

    const display = document.getElementById('display');
    const btn = document.getElementById('drawBtn');
    let isDrawing = false;

    btn.addEventListener('click', () => {
        if (isDrawing) return;
        
        isDrawing = true;
        btn.disabled = true;
        btn.innerText = "抽取中...";
        display.style.color = "#3498db";
        
        let counter = 0;
        const duration = 2000; 
        const interval = 50;   
        
        const timer = setInterval(() => {
            const randomIndex = Math.floor(Math.random() * countries.length);
            display.innerText = countries[randomIndex];
            counter += interval;
            
            if (counter >= duration) {
                clearInterval(timer);
                const finalIndex = Math.floor(Math.random() * countries.length);
                display.innerText = countries[finalIndex];
                display.style.color = "#e74c3c"; 
                btn.disabled = false;
                btn.innerText = "再抽一次";
                isDrawing = false;
            }
        }, interval);
    });
</script>

</body>
</html>
