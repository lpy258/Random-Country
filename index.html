<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家随机抽取</title>
    <style>
        body { font-family: system-ui; background: #eceff1; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; width: 320px; }
        #res { font-size: 42px; font-weight: 800; color: #1a73e8; height: 120px; display: flex; align-items: center; justify-content: center; border: 3px solid #f0f0f0; border-radius: 16px; margin: 20px 0; background: #fcfcfc; }
        button { background: #1a73e8; color: white; border: none; padding: 15px; width: 100%; font-size: 20px; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="margin:0;color:#444;">🌍 目的地抽取</h2>
        <div id="res">点开始</div>
        <button id="go">开始抽取</button>
    </div>
    <script>
        const arr = ["英国","法国","意大利","西班牙","希腊","土耳其","约旦","伊朗","俄罗斯","中国","日本","印度","柬埔寨","印度尼西亚","澳大利亚","马里","埃及","苏丹","埃塞俄比亚","坦桑尼亚","津巴布韦","南非","加拿大","美国","墨西哥","哥伦比亚","秘鲁","玻利维亚","智利","巴西"];
        const btn = document.getElementById('go');
        const res = document.getElementById('res');
        let timer = null;
        btn.onclick = () => {
            if (timer) {
                clearInterval(timer);
                timer = null;
                btn.innerText = '再抽一次';
                res.style.color = '#d93025';
            } else {
                res.style.color = '#1a73e8';
                btn.innerText = '停！';
                timer = setInterval(() => {
                    res.innerText = arr[Math.floor(Math.random() * arr.length)];
                }, 50);
            }
        };
    </script>
</body>
</html>
